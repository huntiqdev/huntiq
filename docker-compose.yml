services:
  # ── PostgreSQL 16 (Authoritative Database) ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: huntiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hulubedej_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hulubedej_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (High-Speed Cache & Worker Queue) ─────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: huntiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ollama Local AI Runtime ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: huntiq-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal-net

  # ── Go Backend (Sole Authority) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huntiq-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-hulubedej_db}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      AI_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huntiq-assistant:latest}
      JWT_SECRET: ${JWT_SECRET:-super-secure-production-jwt-secret-at-least-32-chars!}
      OTP_ENCRYPT_KEY: ${OTP_ENCRYPT_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - internal-net
      - public-net

  # ── Next.js 15 Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huntiq-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - public-net

networks:
  internal-net:
    driver: bridge
    internal: false
  public-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ollama_data:
